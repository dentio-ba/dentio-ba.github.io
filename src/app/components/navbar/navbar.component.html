<nav [class.scrolled]="scrolled()" [class.solid]="solid">
  <div class="nav-inner">
    <a class="logo" routerLink="/" (click)="closeMobile()">
      <img src="dentio-logo.webp" alt="Dentio" class="logo-img">
      <!-- <span class="logo-icon">
        <img src="favicon-icon.svg" alt="Dentio" width="28" height="28">
      </span>
      <span class="logo-text">Dent<span class="logo-accent">io</span></span> -->
    </a>

    <div class="nav-links" [class.mobile-open]="mobileOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobile()">{{ 'nav.home' | translate }}</a>
      <a routerLink="/solutions" routerLinkActive="active" (click)="closeMobile()">{{ 'nav.solutions' | translate }}</a>
      <a routerLink="/clients" routerLinkActive="active" (click)="closeMobile()">{{ 'nav.clients' | translate }}</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobile()">{{ 'nav.contact' | translate }}</a>
    </div>

    <div class="nav-actions">
      <div class="lang-switch">
        <button class="lang-btn" [class.active]="lang.currentLang === 'en'" (click)="lang.setLang('en')">
          <img src="flags/gb.svg" alt="English" class="lang-flag-img">
          <span>EN</span>
        </button>
        <span class="lang-divider">/</span>
        <button class="lang-btn" [class.active]="lang.currentLang === 'bs'" (click)="lang.setLang('bs')">
          <img src="flags/ba.webp" alt="Bosanski" class="lang-flag-img">
          <span>BS</span>
        </button>
      </div>

      <button class="hamburger" [class.active]="mobileOpen()" (click)="toggleMobile()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
