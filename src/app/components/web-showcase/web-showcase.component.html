<section id="web" class="section">
  <div class="container">
    <div class="showcase-layout reverse">
      <div class="showcase-visual">
        <div class="browser-window">
          <div class="browser-header">
            <div class="browser-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="browser-url">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span>dentify.ba</span>
            </div>
          </div>
          <div class="browser-body">
            <div class="mock-web-nav"></div>
            <div class="mock-web-hero">
              <div class="mock-web-title"></div>
              <div class="mock-web-subtitle"></div>
              <div class="mock-web-btn"></div>
            </div>
            <div class="mock-web-cards">
              <div class="mock-web-card"></div>
              <div class="mock-web-card"></div>
              <div class="mock-web-card"></div>
            </div>
          </div>
          <div class="screenshot-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Screenshot</span>
          </div>
        </div>

        <div class="mobile-mockup">
          <div class="mobile-frame">
            <div class="mobile-notch"></div>
            <div class="mobile-content">
              <div class="mock-m-bar"></div>
              <div class="mock-m-card"></div>
              <div class="mock-m-card"></div>
              <div class="mock-m-btn"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="showcase-content">
        <div class="showcase-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Web</span>
        </div>
        <h2>{{ ts.t('web.title') }}</h2>
        <p class="showcase-desc">{{ ts.t('web.subtitle') }}</p>

        <div class="showcase-features">
          @for (f of features; track f.key) {
            <div class="showcase-feature">
              <div class="sf-icon">
                @switch (f.icon) {
                  @case ('wizard') {
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  }
                  @case ('list') {
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  }
                  @case ('team') {
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                  }
                  @case ('form') {
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  }
                }
              </div>
              <div>
                <h4>{{ ts.t('web.' + f.key + '.title') }}</h4>
                <p>{{ ts.t('web.' + f.key + '.desc') }}</p>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
