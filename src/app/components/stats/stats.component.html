<section id="stats" class="section section-dark">
  <div class="container">
    <h2 class="stats-title">Dent<span class="green">io</span> {{ 'stats.title' | translate }}</h2>
    <div class="stats-grid">
      @for (s of stats; track s.key; let i = $index) {
        <div class="stat-card">
          <div class="stat-value">{{ counters[i]() }}</div>
          <div class="stat-label">{{ 'stats.' + s.key | translate }}</div>
        </div>
      }
    </div>
  </div>
</section>
