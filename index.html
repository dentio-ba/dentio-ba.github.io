<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dentio — Preusmjeravanje</title>
  <meta http-equiv="refresh" content="3;url=https://www.dentio.ba/">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1A2E4A 50%, #14486E 100%);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 180px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    p {
      font-size: 1rem;
      color: #94A3B8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
    }

    .loader span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10B981;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .link {
      display: inline-block;
      color: #10B981;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .link:hover {
      border-color: #10B981;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.dentio.ba/dentio-logo.png" alt="Dentio" class="logo">
    <h1>Dentio ima novu stranicu!</h1>
    <p>Preusmjeravamo vas na novu adresu...</p>
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <a href="https://www.dentio.ba/" class="link">www.dentio.ba</a>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = 'https://www.dentio.ba/';
    }, 3000);
  </script>
</body>
</html>
